plugins {
    id 'fabric-loom' version '1.3.0'
    id 'java'
}

group = 'icu.qadvancement'
version = project.findProperty('mod_version') ?: '1.0.0'
archivesBaseName = 'qadvancement'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.findProperty('java_version') as String ?: '17'))
    }
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.minecraft_version}+build.22:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
    runs {
        named('server') {
            client = false
            vmArgs = ['-Dfabric.development=true']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}